[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-twin"
version = "0.1.0"
description = "Controller sample period a continuous-time twin does not model: exact stability window kp*T/2 < kd < 2/T, a hard cap wn*T < 2 for every damping, two distinct failure mechanisms, and the twin-blind deadbeat point"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
