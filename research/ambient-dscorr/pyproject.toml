[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-dscorr"
version = "0.1.0"
description = "Stylised: Dawid-Skene when the two auditors share errors on hard messages"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
