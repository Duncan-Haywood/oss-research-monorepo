[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anytime-audit"
version = "0.1.0"
description = "Anytime-valid sequential audits of noisy verification checks: e-processes vs fixed-sample and peeking tests"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
