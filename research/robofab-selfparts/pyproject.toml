[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-selfparts"
version = "0.1.0"
description = "Can a 3-joint arm assemble a copy of its own printed gripper? Stylised reach, payload and insertion checks"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
