[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ordinal-scores"
version = "0.1.0"
description = "Ranked probability score for ordinal verifier reports (binned drift): exact regret, distance-proportional incentives, threshold decomposition and decision-regret transfer"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
