[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flex-twin"
version = "0.1.0"
description = "Joint flexibility a rigid twin does not model: non-collocated PD loops the twin certifies are unstable or marginal, exact Routh boundary, mass-ratio and damping laws"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
