[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-closure-twin"
version = "0.1.0"
description = "Pose-graph loop closure tuned in a digital twin with independent odometry noise: exact real map error under correlated drift, conservative gain-matching inflation, calibration budget"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
