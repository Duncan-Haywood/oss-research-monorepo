[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sync-twin"
version = "0.1.0"
description = "A two-sensor twin with synchronised clocks: exact gate recall, fusion error and best fusion weight when the real timestamps jitter, one factor kappa = 1 + v^2 s^2 / (2 sigma^2)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
